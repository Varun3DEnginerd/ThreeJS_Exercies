<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThreeJS</title>
    <style>
        body {
            margin: 0;
        }

        canvas.threeJS {
            display: block;
        }

        .volume-file-control {
            position: fixed;
            top: 1rem;
            left: 1rem;
            z-index: 1;
            padding: 0.75rem;
            color: #111;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 0.25rem;
        }
    </style>
</head>
<body>
    <!-- <h2> This will be Three JS Website</h2> -->
    <canvas class="threeJS"> </canvas>
    <script type="module" src="./script.js"></script>

    <div class="volume-file-control">
        <label for="volumeFile">Input Volume File</label>
        <input
            type="file"
            id="volumeFile"
            accept=".raw"
        >
    </div>
    
</body>
</html>
